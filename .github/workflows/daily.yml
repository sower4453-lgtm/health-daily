name: 보건 데일리 자동 수집

on:
  schedule:
    # 시각은 UTC 기준입니다. "0 23 * * *" = 한국 시간 매일 오전 8시.
    # GitHub 사정으로 몇십 분 늦게 시작될 수 있습니다.
    - cron: "0 23 * * *"
  workflow_dispatch: {}   # Actions 탭의 'Run workflow' 버튼으로 바로 실행

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: 수집 실행
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/collect.py
      - name: 결과 저장
        run: |
          git config user.name "health-daily-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "바뀐 내용 없음"
          else
            git commit -m "자동 수집 $(TZ=Asia/Seoul date +%Y-%m-%d)"
            git push
          fi
